services:
  minio:
    image: quay.io/minio/minio:latest
    container_name: annapurna-minio
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16
    container_name: annapurna-postgres
    restart: always
    environment:
      POSTGRES_DB: annapurna
      POSTGRES_USER: annapurna
      POSTGRES_PASSWORD: annapurna
    ports:
      - "5432:5432"
    volumes:
      - ./data/masters.sql:/docker-entrypoint-initdb.d/01_masters.sql:ro
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U annapurna -d annapurna"]
      interval: 3s
      timeout: 3s
      retries: 10

  analytics-engine:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: annapurna-analytics
    restart: always
    environment:
      IN_DOCKER: "true"
      PYTHONPATH: "/app"
      DATA_DIR: "/exam/data"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ROOT_USER: "minioadmin"
      MINIO_ROOT_PASSWORD: "minioadmin"
      MINIO_BUCKET: "annapurna-sales"
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "annapurna"
      POSTGRES_USER: "annapurna"
      POSTGRES_PASSWORD: "annapurna"
    ports:
      - "8501:8501"
    volumes:
      - ./data:/exam/data:ro
      - ./app:/app
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  minio_data:
  pg_data:
